version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: devlens-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=DevLens
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=sqlite:///./devlens.db
      - JWT_SECRET=change-this-in-production-secure-random-key-32chars
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - AI_PROVIDER=mock
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - RATE_LIMIT_REQUESTS=60
      - RATE_LIMIT_WINDOW_SECONDS=60
      - CORS_ORIGINS=["http://localhost", "http://localhost:80", "http://localhost:5173"]
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: devlens-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

volumes:
  backend-data:
